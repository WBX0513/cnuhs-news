<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章 · CNUHS 校园新闻站</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- html-to-image：纯前端 DOM 转图片，CDN 引入即可，无需构建 -->
  <script src="lib/html-to-image.min.js"></script>
</head>
<body>
  <div id="site-header"></div>

  <div class="container" style="padding-top: 32px; padding-bottom: 48px;">
    <div id="articleArea"></div>
  </div>

  <div id="site-footer"></div>

  <script src="js/markdown.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      var S = window.Site;
      S.mountNav(null, 'CNUHS');
      S.mountFileWarning();
      S.renderFooter('CNUHS');

      var id = new URLSearchParams(location.search).get('id');

      S.ready(function () {
        var a = S.findArticle(id);

        if (!a) {
          S.qs('#articleArea').innerHTML =
            '<div class="article-card"><div class="article-body">' +
              S.emptyState('文章不存在或已被删除', '它可能已下线，或者链接有误') +
            '</div></div>';
          return;
        }

        document.title = a.title + ' · CNUHS 校园新闻站';
        var navLink = S.qs('.nav-link[href="list.html?cat=' + (a.category || 'campus') + '"]');
        if (navLink) navLink.classList.add('active');

        var catName = (S.CATEGORIES[a.category] || {}).name || a.category || '校园新闻';
        var related = S.getArticles().filter(function (x) {
          return x.id !== a.id && x.category === a.category;
        }).slice(0, 5);

        // 外链封面需要 crossorigin，本地图片不需要
        var isExtCover = /^https?:\/\//.test(a.cover || '');

        S.qs('#articleArea').innerHTML =
          '<div class="article-layout">' +
            '<article class="article-card" id="articleCard">' +
              (a.cover
                ? '<div class="article-cover"><img src="' + S.esc(a.cover) + '" alt="' + S.esc(a.title) + '"' +
                  (isExtCover ? ' crossorigin="anonymous"' : '') +
                  ' onerror="this.parentNode.style.display=\'none\'"></div>'
                : '') +
              '<div class="article-body">' +
                '<div class="article-topbar">' +
                  '<a class="article-back" href="list.html?cat=' + S.esc(a.category || 'campus') + '">' +
                    '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>' +
                    '返回' + S.esc(catName) +
                  '</a>' +
                  '<div class="article-tools">' +
                    '<button type="button" class="btn btn-outline btn-sm" id="captureBtn">' +
                      '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>' +
                      '下载图片' +
                    '</button>' +
                    '<a class="btn btn-outline btn-sm" href="editor.html?id=' + encodeURIComponent(a.id) + '">' +
                      '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>' +
                      '编辑本文' +
                    '</a>' +
                  '</div>' +
                '</div>' +
                '<div class="article-meta">' +
                  '<span class="tag tag-' + S.esc(a.category) + '">' + S.esc(catName) + '</span>' +
                  '<time>' + S.esc(a.date || '') + '</time>' +
                  (a.author ? '<span>记者：' + S.esc(a.author) + '</span>' : '') +
                '</div>' +
                '<h1 class="article-title">' + S.esc(a.title) + '</h1>' +
                (a.summary ? '<div class="article-summary">' + S.esc(a.summary) + '</div>' : '') +
                '<div class="md">' + Markdown.toHtml(a.content || '') + '</div>' +
              '</div>' +
            '</article>' +
            '<aside>' +
              '<div class="side-card"><div class="side-title">相关阅读</div>' +
                (related.length
                  ? '<ul class="side-list">' + related.map(function (r) {
                      return '<li><a href="article.html?id=' + encodeURIComponent(r.id) + '">' +
                        '<span class="sl-date">' + S.esc(r.date || '') + '</span>' +
                        '<span class="sl-title">' + S.esc(r.title) + '</span></a></li>';
                    }).join('') + '</ul>'
                  : '<p class="side-tip">本栏目暂无其他文章。</p>') +
              '</div>' +
              '<div class="side-card"><div class="side-title">小提示</div>' +
                '<p class="side-tip">本文由 Markdown 渲染。撰写新闻请前往「新闻编辑」页面，支持标题、列表、图片、表格等语法。</p>' +
              '</div>' +
            '</aside>' +
          '</div>';

        setupCapture(a);
      });

      /* =========================================================
         文章转图片：html-to-image（纯前端，无后端，可直接部署到 GitHub Pages）
         ========================================================= */
      function setupCapture(article) {
        var btn = S.qs('#captureBtn');
        if (!btn) return;

        if (typeof htmlToImage === 'undefined') {
          btn.disabled = true;
          btn.title = 'html-to-image 未加载成功，请检查网络或 CDN';
          return;
        }

        btn.addEventListener('click', function () {
          captureArticle(article, btn);
        });
      }

      // 品牌图标：与顶部导航中的“校园”图标一致
      var BRAND_ICON =
        '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" ' +
        'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<path d="M4 20h16"/>' +
          '<path d="M6 20V9l6-5 6 5v11"/>' +
          '<path d="M10 20v-6h4v6"/>' +
        '</svg>';

      function captureArticle(article, btn) {
        var card = S.qs('#articleCard');
        if (!card) return;

        var originalHTML = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>生成中…';

        // 临时插入带图标的水印，截图后自动移除
        var bodyEl = S.qs('.article-body', card);
        var watermark = document.createElement('div');
        watermark.className = 'capture-watermark';
        watermark.innerHTML =
          BRAND_ICON +
          '<div class="wm-text">' +
            '<span class="wm-brand">CNUHS 校园新闻站</span>' +
            '<span class="wm-meta">' + (article.date || '') + ' · CAMPUS NEWS</span>' +
          '</div>';
        bodyEl.appendChild(watermark);

        // 长文动态降采样，避免 Canvas 超出浏览器尺寸上限
        var h = card.offsetHeight;
        var pixelRatio = h > 6000 ? 1 : (h > 3000 ? 1.5 : Math.min(window.devicePixelRatio || 1, 2));

        Promise.resolve()
          // 1) 等字体加载完成，避免截图时字体回退
          .then(function () {
            return (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
          })
          // 2) 等卡片内所有 <img> 加载完成
          .then(function () {
            var imgs = card.querySelectorAll('img');
            return Promise.all([].map.call(imgs, function (img) {
              if (img.complete) return Promise.resolve();
              return new Promise(function (res) { img.onload = img.onerror = res; });
            }));
          })
          // 3) 转 PNG
          .then(function () {
            return htmlToImage.toPng(card, {
              pixelRatio: pixelRatio,
              cacheBust: true,
              backgroundColor: '#ffffff',
              // 排除「返回 / 下载图片 / 编辑本文」操作栏，让分享图干净
              filter: function (node) {
                if (node.nodeType !== 1) return true;
                var cl = node.classList;
                return !(cl && cl.contains('article-topbar'));
              }
            });
          })
          // 4) 触发下载
          .then(function (dataUrl) {
            var safeName = String(article.title || 'article')
              .replace(/[\\/:*?"<>|\s]+/g, '_')
              .slice(0, 40) || 'article';

            var link = document.createElement('a');
            link.download = safeName + '.png';
            link.href = dataUrl;
            link.click();
          })
          .catch(function (err) {
            console.error('[capture]', err);
            alert('生成图片失败：' + (err && err.message ? err.message : err));
          })
          .then(function () {   // finally
            watermark.remove();
            btn.disabled = false;
            btn.innerHTML = originalHTML;
          });
      }
    })();
  </script>
</body>
</html>
