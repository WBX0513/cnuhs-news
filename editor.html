<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新闻编辑 · CNUHS 校园新闻站</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <div class="container">
    <div class="editor-head">
      <h1>新闻编辑</h1>
      <p>使用 Markdown 撰写新闻，实时预览。文章保存在 <code>data/文章id.json</code>，通过服务器自动读写，无需任何授权。图片放到 <code>assets/img/</code> 目录后填写路径即可。</p>
    </div>

    <!-- 基本信息 -->
    <div class="editor-form">
      <div class="field">
        <label for="fTitle">标题 *</label>
        <input id="fTitle" type="text" maxlength="80" placeholder="请输入新闻标题">
      </div>
      <div class="field">
        <label for="fCat">栏目 *</label>
        <select id="fCat">
          <option value="campus">校园新闻</option>
          <option value="notice">通知公告</option>
          <option value="activity">活动报道</option>
        </select>
      </div>
      <div class="field">
        <label for="fAuthor">记者</label>
        <input id="fAuthor" type="text" maxlength="30" placeholder="记者/作者姓名（可留空）">
      </div>
      <div class="field">
        <label for="fDate">发布日期</label>
        <input id="fDate" type="date">
      </div>
      <div class="field">
        <label for="fCover">封面图片路径</label>
        <input id="fCover" type="text" placeholder="assets/img/news/example.jpg（留空显示占位图）">
        <span class="hint">将图片放入 assets/img/ 目录，填写相对路径</span>
      </div>
      <div class="field field-full">
        <label for="fSummary">摘要</label>
        <input id="fSummary" type="text" maxlength="140" placeholder="一句话摘要，显示在列表卡片上（可留空）">
      </div>
    </div>

    <!-- Markdown 编辑区 -->
    <div class="field field-full" style="margin-bottom: 6px;">
      <label for="fContent">正文（Markdown）*</label>
    </div>
    <div class="md-toolbar" id="toolbar"></div>
    <div class="editor-main">
      <div class="editor-pane">
        <div class="editor-pane-label">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          Markdown 输入
        </div>
        <textarea id="fContent" spellcheck="false" placeholder="在这里用 Markdown 撰写正文……

## 二级标题
段落文字，支持 **粗体**、*斜体*、[链接](index.html)。

- 列表项一
- 列表项二

![配图说明](assets/img/news/example.jpg)"></textarea>
      </div>
      <div class="editor-pane">
        <div class="editor-pane-label">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          实时预览
        </div>
        <div class="editor-preview md" id="preview"></div>
      </div>
    </div>

    <!-- 操作按钮 -->
    <div class="editor-actions">
      <button class="btn btn-dark" id="btnSave">保存并发布</button>
      <button class="btn btn-outline" id="btnPreview">在新窗口预览</button>
      <button class="btn btn-danger" id="btnClear">清空表单</button>
    </div>

    <!-- 自动保存状态 -->
    <div class="save-status">
      <span id="draftStatus"></span>
      <span class="dot">·</span>
      <span id="syncStatus">正在连接服务器…</span>
    </div>

    <!-- 已发布文章管理 -->
    <div class="section-head" style="margin-top: 26px;">
      <div>
        <h2 class="section-title">已发布文章</h2>
        <p class="section-sub">data 文件夹中的全部文章。点「编辑」即可修改，保存后自动覆盖原文件</p>
      </div>
    </div>
    <table class="manage-table" style="margin-bottom: 56px;">
      <thead>
        <tr><th style="width:32%">标题</th><th>栏目</th><th>记者</th><th>日期</th><th style="width:170px">操作</th></tr>
      </thead>
      <tbody id="manageBody"></tbody>
    </table>
  </div>

  <div id="site-footer"></div>
  <div class="toast" id="toast"></div>

  <script src="js/markdown.js"></script>
  <script src="js/app.js"></script>
  <script src="js/editor.js"></script>
  <script>
    (function () {
      window.Site.mountNav('editor', 'CNUHS');
      window.Site.renderFooter('CNUHS');
      window.Editor.init();
    })();
  </script>
</body>
</html>
