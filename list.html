<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>栏目列表 · CNUHS 校园新闻站</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <div class="page-banner">
    <div class="container">
      <h1 id="pageTitle">栏目</h1>
      <p id="pageDesc"></p>
    </div>
  </div>

  <div class="container">
    <div class="cat-tabs" id="catTabs"></div>
    <p class="list-count" id="listCount"></p>
    <div class="news-grid" id="newsGrid"></div>
  </div>

  <div id="site-footer"></div>

  <script src="js/markdown.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      var S = window.Site;
      S.mountNav(null, 'CNUHS');
      S.mountFileWarning();
      S.renderFooter('CNUHS');

      var CATS = S.CATEGORIES;
      var cat = new URLSearchParams(location.search).get('cat');
      if (!CATS[cat]) cat = 'campus';

      // 导航高亮 + 标题
      var navLink = S.qs('.nav-link[href="list.html?cat=' + cat + '"]');
      if (navLink) navLink.classList.add('active');
      S.qs('#pageTitle').textContent = CATS[cat].name;
      S.qs('#pageDesc').textContent = CATS[cat].desc;
      document.title = CATS[cat].name + ' · CNUHS 校园新闻站';

      // 栏目切换标签
      S.qs('#catTabs').innerHTML = Object.keys(CATS).map(function (k) {
        return '<a class="cat-tab' + (k === cat ? ' active' : '') + '" href="list.html?cat=' + k + '">' + CATS[k].name + '</a>';
      }).join('') + '<a class="cat-tab" href="index.html">全部</a>';

      // 文章列表
      S.ready(function () {
      var list = S.getArticles().filter(function (a) { return a.category === cat; });
      S.qs('#listCount').textContent = '共 ' + list.length + ' 篇';
      S.qs('#newsGrid').innerHTML = list.length
        ? list.map(S.articleCard).join('')
        : S.emptyState('本栏目暂无文章', '去「新闻编辑」页面为本栏目写一篇文章吧');
      });
    })();
  </script>
</body>
</html>
