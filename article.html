<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章 · CNUHS 校园新闻站</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <div class="container" style="padding-top: 32px; padding-bottom: 48px;">
    <div id="articleArea"></div>
  </div>

  <div id="site-footer"></div>

  <script src="js/markdown.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      var S = window.Site;
      S.mountNav(null, 'CNUHS');
      S.mountFileWarning();
      S.renderFooter('CNUHS');

      var id = new URLSearchParams(location.search).get('id');

      S.ready(function () {
      var a = S.findArticle(id);

      if (!a) {
        S.qs('#articleArea').innerHTML =
          '<div class="article-card"><div class="article-body">' +
            S.emptyState('文章不存在或已被删除', '它可能已下线，或者链接有误') +
          '</div></div>';
        return;
      }

      document.title = a.title + ' · CNUHS 校园新闻站';
      // 所属栏目导航高亮
      var navLink = S.qs('.nav-link[href="list.html?cat=' + (a.category || 'campus') + '"]');
      if (navLink) navLink.classList.add('active');

      var catName = (S.CATEGORIES[a.category] || {}).name || a.category || '校园新闻';
      var related = S.getArticles().filter(function (x) {
        return x.id !== a.id && x.category === a.category;
      }).slice(0, 5);

      S.qs('#articleArea').innerHTML =
        '<div class="article-layout">' +
          '<article class="article-card">' +
            (a.cover
              ? '<div class="article-cover"><img src="' + S.esc(a.cover) + '" alt="' + S.esc(a.title) + '" onerror="this.parentNode.style.display=\'none\'"></div>'
              : '') +
            '<div class="article-body">' +
              '<div class="article-topbar">' +
                '<a class="article-back" href="list.html?cat=' + S.esc(a.category || 'campus') + '">' +
                  '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>' +
                  '返回' + S.esc(catName) +
                '</a>' +
                '<a class="btn btn-outline btn-sm" href="editor.html?id=' + encodeURIComponent(a.id) + '">' +
                  '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>' +
                  '编辑本文' +
                '</a>' +
              '</div>' +
              '<div class="article-meta">' +
                '<span class="tag tag-' + S.esc(a.category) + '">' + S.esc(catName) + '</span>' +
                '<time>' + S.esc(a.date || '') + '</time>' +
                (a.author ? '<span>记者：' + S.esc(a.author) + '</span>' : '') +
              '</div>' +
              '<h1 class="article-title">' + S.esc(a.title) + '</h1>' +
              (a.summary ? '<div class="article-summary">' + S.esc(a.summary) + '</div>' : '') +
              '<div class="md">' + Markdown.toHtml(a.content || '') + '</div>' +
            '</div>' +
          '</article>' +
          '<aside>' +
            '<div class="side-card"><div class="side-title">相关阅读</div>' +
              (related.length
                ? '<ul class="side-list">' + related.map(function (r) {
                    return '<li><a href="article.html?id=' + encodeURIComponent(r.id) + '">' +
                      '<span class="sl-date">' + S.esc(r.date || '') + '</span>' +
                      '<span class="sl-title">' + S.esc(r.title) + '</span></a></li>';
                  }).join('') + '</ul>'
                : '<p class="side-tip">本栏目暂无其他文章。</p>') +
            '</div>' +
            '<div class="side-card"><div class="side-title">小提示</div>' +
              '<p class="side-tip">本文由 Markdown 渲染。撰写新闻请前往「新闻编辑」页面，支持标题、列表、图片、表格等语法。</p>' +
            '</div>' +
          '</aside>' +
        '</div>';
      });
    })();
  </script>
</body>
</html>
